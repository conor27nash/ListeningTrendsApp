version: '3.9'
services:
  client:
    build:
      context: spotifytrendsapp.client
      dockerfile: Dockerfile
      target: production
    ports:
      - "80:80"
    depends_on:
      - server
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: SpotifyTrendsApp.Server/Dockerfile
    ports:
      - "5000:5000"
    depends_on:
      - topitems
      - recentlyplayed
      - trackservice
      - artistservice
      - userservice
      - analyticsservice
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - SPOTIFY_REDIRECT_URI=${SPOTIFY_REDIRECT_URI}
      - TopItemsService__BaseUrl=http://topitems:5000
      - RecentlyPlayedService__BaseUrl=http://recentlyplayed:5000
      - TrackService__BaseUrl=http://trackservice:5000
      - ArtistService__BaseUrl=http://artistservice:5000
      - UserService__BaseUrl=http://userservice:5000
      - AnalyticsService__BaseUrl=http://analyticsservice:5000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  topitems:
    build:
      context: TopItemsService
      dockerfile: Dockerfile
    expose:
      - "5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    restart: unless-stopped

  recentlyplayed:
    build:
      context: RecentlyPlayedService
      dockerfile: Dockerfile
    expose:
      - "5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    restart: unless-stopped

  trackservice:
    build:
      context: TrackService
      dockerfile: Dockerfile
    expose:
      - "5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    restart: unless-stopped

  artistservice:
    build:
      context: ArtistService
      dockerfile: Dockerfile
    expose:
      - "5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    restart: unless-stopped

  userservice:
    build:
      context: UserService
      dockerfile: Dockerfile
    expose:
      - "5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    restart: unless-stopped

  analyticsservice:
    build:
      context: .
      dockerfile: AnalyticsService/Dockerfile
    expose:
      - "5000"
    depends_on:
      - topitems
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - TopItemsService__BaseUrl=http://topitems:5000
    restart: unless-stopped
